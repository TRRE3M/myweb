<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的笔记</title>
  <style>
    /* CSS 部分 */
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f5f7; color: #222; line-height: 1.6; transition: 0.3s; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
    
    .note-card { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .note-card h2 { font-size: 18px; margin-top: 0; margin-bottom: 8px; color: #007aff; }
    .note-card p { margin: 0; color: #444; font-size: 15px; }
    .back-link { display: inline-block; margin-top: 20px; color: #007aff; text-decoration: none; font-weight: bold; }

    /* 夜间模式专属样式（加了 .dark 就会生效） */
    body.dark { background: #1a1a1a; color: #eee; }
    body.dark .note-card { background: #2a2a2a; color: #ddd; }
    body.dark .note-card p { color: #aaa; }
    body.dark .subtitle { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h1>我的笔记</h1>
    <p class="subtitle">这里以后放我的学习笔记和生活小记。</p>
    
    <!-- 新增：切换按钮 -->
    <button onclick="toggleDarkMode()" style="margin-bottom: 16px; padding: 8px 16px; font-size: 14px; border-radius: 8px; border: none; background: #007aff; color: white; cursor: pointer;">
      🌙 切换夜间模式
    </button>

    <div class="note-card">
      <h2>📝 第一条笔记</h2>
      <p>今天学会了怎么在 GitHub 上修改代码，保存后等 1-2 分钟，手机刷新就能看到变化，好神奇！</p>
    </div>

    <div class="note-card">
      <h2>📚 学习计划</h2>
      <p>1. 掌握 HTML 基础标签。<br>2. 学会给网页加一点样式。<br>3. 把剩下的工具、记账、收藏页面搭好。</p>
    </div>

    <a class="back-link" href="../index.html">← 返回首页</a>
  </div>

  <script>
    // JS 部分：定义切换夜间模式的功能
    function toggleDarkMode() {
      // 给 body 标签加上或移除 "dark" 这个类名
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
