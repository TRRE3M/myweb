<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电脑软件收录</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f5f5f7; color: #222; line-height: 1.6; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
    
    .app-card { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .app-card h2 { font-size: 18px; margin-top: 0; margin-bottom: 8px; color: #007aff; }
    .app-card p { margin: 0 0 8px 0; color: #444; font-size: 14px; }
    .app-card .usage { font-size: 13px; color: #666; background: #f9f9f9; padding: 8px; border-radius: 8px; }
    
    .back-link { display: inline-block; margin-top: 20px; color: #007aff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>常用电脑软件</h1>
    <p class="subtitle">收录常用软件、下载地址和使用说明</p>
    
    <!-- 这是一个软件卡片示例，以后你可以复制这个结构，换成其他软件 -->
    <div class="app-card">
      <h2>💻 软件名称（例如：Everything）</h2>
      <p>官方下载地址：<a href="https://www.voidtools.com/" target="_blank">点击前往官网</a></p>
      <div class="usage">
        <strong>使用方法：</strong><br>
        1. 下载并安装。<br>
        2. 打开后直接输入文件名，瞬间就能搜到电脑里的文件，比 Windows 自带搜索快很多。
      </div>
    </div>

    <div class="app-card">
      <h2>💻 软件名称（例如：PotPlayer）</h2>
      <p>官方下载地址：<a href="https://potplayer.daum.net/" target="_blank">点击前往官网</a></p>
      <div class="usage">
        <strong>使用方法：</strong><br>
        1. 下载安装。<br>
        2. 打开后可以直接拖拽视频文件进去播放，支持几乎所有格式。
      </div>
    </div>

    <a class="back-link" href="../index.html">← 返回首页</a>
  </div>
</body>
</html>
